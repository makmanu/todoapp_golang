services:
  todoapp-postgres:
    image: postgres:18.1-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Fill POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Fill POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Fill POSTGRES_DB in .env}
    volumes:
      - ./out/pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: ${POSTGRES_TIMEOUT:-10s}
      retries: 30
      start_period: 5s
    restart: unless-stopped

  todoapp-postgres-migrate:
    image: migrate/migrate:v4.18.3
    profiles: ["tools"]
    environment:
      PGUSER: ${POSTGRES_USER:?Fill POSTGRES_USER in .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Fill POSTGRES_PASSWORD in .env}
      PGDATABASE: ${POSTGRES_DB:?Fill POSTGRES_DB in .env}
    volumes:
      - ./migrations:/migrations
    depends_on:
      todoapp-postgres:
        condition: service_healthy

  port-forwarder:
    image: alpine/socat:1.8.0.3
    profiles: ["tools"]
    command: ["TCP-LISTEN:5432,fork,reuseaddr", "TCP:todoapp-postgres:5432"]
    ports:
      - "127.0.0.1:5432:5432"
    depends_on:
      todoapp-postgres:
        condition: service_healthy
